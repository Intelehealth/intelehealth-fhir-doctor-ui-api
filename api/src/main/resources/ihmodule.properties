# IH module bundled defaults (override via Administration → Manage Global Properties when needed).

# Patient data exchange runtime endpoints and credentials
local.openmrs.url=https://intelehealth-prod-master-new.mpower-social.com/openmrs
local.openmrs.password.basic.auth=admin:apple@1Mango

# OpenCR / OpenHIM (OpenHIM channel; path ignored for $mdm-match — authority is scheme+host+port, then POST /fhir/$mdm-match)
opencr.openhim.url=http://192.168.19.152:6001/openmrs-fhir-mdm/patient-create
# Optional: force MDM host if it differs from opencr.openhim.url authority (default: unset = derive from opencr.openhim.url)
#opencr.openhim.mdm.authority.base.url=http://192.168.19.152:6001
opencr.openhim.mediator.password.basic.auth=mpower:Admin123
# OpenHIM client channel / FHIR app (Postman $mdm-match user fhir_app) — NOT the same as mediator.
opencr.openhim.clientid.password.basic.auth=fhir_app:Admin123

# Published config API: fhir_module.fhir=true enables outbound patient FHIR sync; false queues unsync_patient.
intelehealth.config.published.url=https://intelehealth-prod-master-new.mpower-social.com:4004/api/config/getPublishedConfig
intelehealth.fhir.sync.published.config.cache.seconds=60

# Central FHIR / OpenHIM HTTP timeouts (patient create, update, HAPI transaction client)
intelehealth.fhir.central.http.connect.timeout.ms=30000
intelehealth.fhir.central.http.read.timeout.ms=90000

# MPI identifier type name (OpenMRS PatientIdentifierType text)
intelehealth.fhir.resource.identifier.name=MPI

# OpenMRS patient identifier type for central FHIR Patient.id (source patient routing)
intelehealth.fhir.patient.source.identifier.type.uuid=b2f192c2-346a-486c-bcb4-7a35616890ba
intelehealth.fhir.patient.source.identifier.type.name=Source Patient Id

intelehealth.fhir.structuredefinition.extension.url=http://intelehealth-central-fhir.mpower-social.com/fhir/StructureDefinition/
intelehealth.fhir.patient.profile.url=https://ih-ig.mpower-social.com/StructureDefinition/IH-patient-profile
intelehealth.fhir.patient.profile.definition.path=structureDefinition/StructureDefinition-IH-patient-profile.json

# Created-patient export tuning
intelehealth.fhir.patient.export.created.parallelism=6

# Upload import: preferred OpenMRS identifier type for created patient
intelehealth.fhir.patient.import.preferred.identifier.type.uuid=05a29f94-c0ed-11e2-94be-8c13b969e334

# Upload import: defer to DUPLICATE_REVIEW when highest fuzzy candidate score is at or above this value (percent 0-100; 0.6 also accepted as 60%)
patient.import.fuzzy.duplicate.threshold=60

# FHIR-style fuzzy patient match defaults
intelehealth.fhir.patient.match.enabled=true
intelehealth.fhir.patient.match.threshold=70
intelehealth.fhir.patient.match.confidence.high=85
intelehealth.fhir.patient.match.confidence.medium=70
intelehealth.fhir.patient.match.field.match.threshold=60
intelehealth.fhir.patient.match.max.candidates=500
intelehealth.fhir.patient.match.field.name.enabled=true
intelehealth.fhir.patient.match.field.dob.enabled=true
intelehealth.fhir.patient.match.field.phone.enabled=true
intelehealth.fhir.patient.match.field.address.enabled=true
intelehealth.fhir.patient.match.field.gender.enabled=true
intelehealth.fhir.patient.match.field.identifier.enabled=true
intelehealth.fhir.patient.match.field.name.weight=0.45
intelehealth.fhir.patient.match.field.dob.weight=0.20
intelehealth.fhir.patient.match.field.phone.weight=0.20
intelehealth.fhir.patient.match.field.address.weight=0.10
intelehealth.fhir.patient.match.field.gender.weight=0.05
intelehealth.fhir.patient.match.field.identifier.weight=0.05
intelehealth.fhir.patient.match.algorithm.name=jaro_winkler
intelehealth.fhir.patient.match.algorithm.phone=levenshtein
intelehealth.fhir.patient.match.algorithm.address=token_jaccard
intelehealth.fhir.patient.match.algorithm.phonetic.boost.enabled=true
intelehealth.fhir.patient.match.algorithm.phonetic.boost=DOUBLE_METAPHONE
